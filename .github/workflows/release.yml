name: Release validation

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pinned repository tools
        uses: groovemap-music/.github/.github/actions/setup-tools@main
      - name: Build and validate without publishing
        run: |
          just setup
          just release-dry-run
